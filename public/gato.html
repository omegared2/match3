<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Gatinho — Vila do Gato</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#f4f9f0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(124,212,124,.35), transparent 60%),
      radial-gradient(80% 60% at 90% 110%, rgba(255,157,0,.18), transparent 60%),
      linear-gradient(180deg,#101a12 0%, #0b120c 100%);
    min-height:100vh; text-align:center; overflow-x:hidden;
  }
  .glow { text-shadow:0 0 18px rgba(124,212,124,.6); }

  header { position:relative; display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px 8px; height:58px; }
  header h1 { font-size:24px; letter-spacing:1px; font-weight:900;
    background:linear-gradient(135deg,#ffe680,#ff9d00); -webkit-background-clip:text; background-clip:text;
    color:transparent; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  header h1 .cat { filter:none; color:#fff; }
  .pill { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:800;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15); }
  .pill b { color:#ffd968; }

  .tabs { display:flex; gap:10px; padding:12px 16px 6px; }
  .tab { flex:1; border:none; border-radius:16px; padding:12px; font-size:15px; font-weight:800; cursor:pointer;
    background:rgba(255,255,255,.07); color:#dfeccf; border:1px solid rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08); transition:transform .12s, box-shadow .2s; }
  .tab:active { transform:scale(.96); }
  .tab.on { background:linear-gradient(135deg,#4ade80,#16a34a); color:#06280f;
    border-color:rgba(255,255,255,.35); box-shadow:0 6px 20px rgba(74,222,128,.35); }

  .panel { padding:14px 16px; }
  .hidden { display:none; }

  /* máquina */
  .mascote { font-size:76px; line-height:1.05; margin:8px 0 2px; filter:drop-shadow(0 8px 18px rgba(124,212,124,.4)); animation:float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .machine { position:relative; margin:12px auto 6px; width:min(330px,92vw); padding:18px 12px; border-radius:26px;
    background:linear-gradient(160deg,#23331f,#141f14 70%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 16px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -18px 40px rgba(0,0,0,.35); }
  .slot { display:flex; gap:10px; justify-content:center; }
  .reel { width:86px; height:124px; border-radius:18px; background:
      radial-gradient(120% 90% at 50% 0%, #1c301c, #0a120a 75%);
    border:2px solid rgba(255,255,255,.16);
    box-shadow:inset 0 0 34px rgba(0,0,0,.75), inset 0 2px 0 rgba(124,212,124,.25), 0 6px 16px rgba(0,0,0,.4);
    display:flex; flex-direction:column; justify-content:center; align-items:center; font-size:58px; overflow:hidden; position:relative; }
  .reel:after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%, transparent 70%, rgba(0,0,0,.5)); pointer-events:none; }
  .spin-btn { width:min(300px,88vw); margin:14px auto 4px; border:none; border-radius:20px; padding:18px; font-size:20px; font-weight:900;
    background:linear-gradient(135deg,#ffd968,#ff8a00); color:#3a2400; cursor:pointer; display:block;
    box-shadow:0 10px 26px rgba(255,138,0,.4), inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .1s; }
  .spin-btn:active:not(:disabled){ transform:scale(.95); }
  .spin-btn:disabled { opacity:.55; cursor:default; }
  .msg { min-height:26px; font-size:16px; padding:6px 16px; font-weight:800; }
  .msg.bom { color:#4ade80; text-shadow:0 0 14px rgba(74,222,128,.5); }
  .msg.foi { color:#ff9090; }
  .mini { font-size:12px; color:#86a07f; padding:0 28px 4px; line-height:1.4; }

  /* vila */
  .world { display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:8px 16px; font-size:14px; font-weight:800;
    background:linear-gradient(135deg,rgba(124,212,124,.2),rgba(74,222,128,.08)); border:1px solid rgba(124,212,124,.35);
    box-shadow:0 4px 14px rgba(0,0,0,.3); margin-bottom:6px; }
  .vtitle { font-size:22px; font-weight:900; margin:4px 0 2px; }
  .vsub { font-size:12px; color:#86a07f; letter-spacing:1px; text-transform:uppercase; }
  .vlvl { font-size:13px; color:#b7d3b0; padding:6px 0 2px; }
  .prog { background:rgba(255,255,255,.09); border-radius:999px; height:12px; margin:8px auto 14px; width:min(320px,86vw); overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4); }
  .prog i { display:block; height:100%; background:linear-gradient(90deg,#4ade80,#16a34a); width:0; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .daily { display:flex; align-items:center; justify-content:center; gap:8px; width:min(320px,86vw); margin:0 auto 10px;
    border:none; border-radius:16px; padding:12px; font-size:15px; font-weight:800; cursor:pointer;
    background:linear-gradient(135deg,#7dd3fc,#38bdf8); color:#04222f;
    box-shadow:0 8px 20px rgba(56,189,248,.3), inset 0 2px 0 rgba(255,255,255,.5); transition:transform .1s; }
  .daily:active:not(:disabled){ transform:scale(.96); }
  .daily:disabled { opacity:.55; cursor:default; }

  .blds { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(340px,92vw); margin:6px auto; }
  .bld { position:relative; border-radius:18px; padding:12px; text-align:left;
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1); }
  .bld .e { font-size:40px; }
  .bld .nome { font-size:15px; font-weight:800; margin:4px 0 2px; }
  .bld .tiers { display:flex; gap:4px; margin:4px 0; }
  .bld .tiers i { width:9px; height:9px; border-radius:999px; background:rgba(255,255,255,.15); box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
  .bld .tiers i.on { background:linear-gradient(135deg,#4ade80,#16a34a); box-shadow:0 0 8px rgba(74,222,128,.7); }
  .bld .custo { font-size:12px; color:#ffd968; font-weight:700; }
  .bld.done { border-color:#4ade80; background:linear-gradient(160deg,rgba(74,222,128,.2),rgba(74,222,128,.05)); }
  .bld.max .nome { color:#86c86e; }
  .bld.next { border-color:rgba(255,215,0,.6); box-shadow:0 0 0 1px rgba(255,215,0,.5), 0 8px 24px rgba(255,180,0,.25); }

  .build-btn { width:min(320px,86vw); margin:14px auto 8px; border:none; border-radius:18px; padding:16px; font-size:17px; font-weight:900;
    background:linear-gradient(135deg,#ffd968,#ff8a00); color:#3a2400; cursor:pointer; display:block;
    box-shadow:0 10px 24px rgba(255,138,0,.35), inset 0 2px 0 rgba(255,255,255,.5); transition:transform .1s; }
  .build-btn:active:not(:disabled){ transform:scale(.96); }
  .build-btn:disabled { opacity:.5; }
  .adv-btn { width:min(320px,86vw); margin:14px auto 8px; border:none; border-radius:18px; padding:16px; font-size:17px; font-weight:900;
    background:linear-gradient(135deg,#c084fc,#7c3aed); color:#1c0136; cursor:pointer; display:block;
    box-shadow:0 10px 24px rgba(124,58,237,.4), inset 0 2px 0 rgba(255,255,255,.45); transition:transform .1s;
    animation:pulse 1.6s ease-in-out infinite; }
  .adv-btn:active{ transform:scale(.96); }
  @keyframes pulse { 0%,100%{box-shadow:0 10px 24px rgba(124,58,237,.4)} 50%{box-shadow:0 10px 34px rgba(124,58,237,.75)} }

  /* recentes */
  .recent { padding:10px 16px 30px; }
  .recent h3 { font-size:12px; color:#7a9a7a; letter-spacing:2px; margin-bottom:10px; }
  .chips { display:flex; flex-direction:column; gap:6px; }
  .chip { display:flex; justify-content:space-between; align-items:center; border-radius:14px; padding:9px 14px; font-size:12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); }
  .chip .n { color:#9bb89b; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .s { display:flex; gap:3px; font-size:16px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .chip .v { font-weight:900; } .chip .v.ok { color:#4ade80; } .chip .v.nao { color:#ff8d8d; }

  /* confete de vitória */
  .burst { position:fixed; top:40%; left:50%; pointer-events:none; z-index:50; }
  .coin-float { position:fixed; z-index:60; font-size:30px; font-weight:900; color:#ffd968; text-shadow:0 2px 8px rgba(0,0,0,.6); animation:rise 1.3s ease-out forwards; pointer-events:none; }
  @keyframes rise { 0%{transform:translateY(0) scale(.6); opacity:0} 20%{opacity:1; transform:translateY(-10px) scale(1.1)} 100%{transform:translateY(-110px) scale(1); opacity:0} }
  .p { position:absolute; font-size:18px; animation:pop 1s ease-out forwards; }
  @keyframes pop { 0%{transform:translate(0,0) scale(.4); opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.2); opacity:0} }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:70;
    background:rgba(10,16,10,.94); border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:12px 20px; font-size:14px; font-weight:800;
    box-shadow:0 12px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1><span class="cat">🐱</span> GATINHO</h1>
  <span class="pill">💰 <b id="coins">?</b> 🪙</span>
</header>

<div class="tabs">
  <button class="tab on" id="tabSlot">🎰 Máquina</button>
  <button class="tab" id="tabVila">🏠 Vila</button>
</div>

<div class="panel" id="panelSlot">
  <div class="mascote">🐱</div>
  <div class="machine">
    <div class="slot" id="slot">
      <div class="reel" id="r0">🐱</div>
      <div class="reel" id="r1">🐟</div>
      <div class="reel" id="r2">🧶</div>
    </div>
    <button class="spin-btn" id="btnSpin">🎰 Girar · <span id="custo">20</span> 🪙</button>
    <div class="msg" id="msg">Bem-vindo de volta! 🐾</div>
    <div class="mini">O Gatinho gira! 2 ou 3 iguais pagam moedas. Ganhe moedas pra evoluir sua Vila.</div>
  </div>
</div>

<div class="panel hidden" id="panelVila">
  <div class="world"><span id="wEmoji">🌱</span> <span id="wName">Mundo Inicial</span></div>
  <div class="vtitle" id="vName">Vila do Gato</div>
  <div class="vsub" id="vPos">Vila 1 de 2000</div>
  <div class="vlvl">🏘️ Nível <b id="vlvl">1</b> · Progresso</div>
  <div class="prog"><i id="vprog"></i></div>
  <button class="daily" id="btnDaily">🎁 Recompensa diária +<span id="drv">40</span> 🪙</button>
  <div class="blds" id="blds"></div>
</div>

<div class="recent">
  <h3>ÚLTIMOS GIROS</h3>
  <div class="chips" id="recent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = ''; // servido sempre pelo mesmo servidor da API (local ou Render)
  let userId = localStorage.getItem('match3_user') || ('player_' + Math.random().toString(36).slice(2,10));
  localStorage.setItem('match3_user', userId);

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString('pt-BR');
  const SYMS = ['🐱','🐟','🧶','🥛','🐁','💤','❌'];
  let spinCost = 20, dailyReward = 40, village = null, order = [];

  function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
  function msg(txt, cls){ const el=$('msg'); el.textContent=txt; el.className='msg '+(cls||''); }
  function setCoins(n){ $('coins').textContent = fmt(n||0); }
  function post(path, body){
    return fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());
  }

  function celebrate(n){
    for(let i=0;i<14;i++){
      const p=document.createElement('div'); p.className='p';
      p.textContent=['🪙','✨','⭐','🐾'][i%4];
      const a=Math.random()*Math.PI*2, d=60+Math.random()*120;
      p.style.left='50%'; p.style.top='42%';
      p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', (Math.sin(a)*d-40)+'px');
      document.body.appendChild(p); setTimeout(()=>p.remove(),1000);
    }
    const f=document.createElement('div'); f.className='coin-float'; f.textContent='+'+fmt(n);
    f.style.left='50%'; f.style.top='44%'; f.style.transform='translateX(-50%)';
    document.body.appendChild(f); setTimeout(()=>f.remove(),1400);
  }

  function bloquear(v){ $('btnSpin').disabled=v; }

  function girar(){
    bloquear(true); msg('🎰 Girando...');
    const r0=$('r0'),r1=$('r1'),r2=$('r2');
    const anim = setInterval(()=>{ r0.textContent=SYMS[Math.random()*SYMS.length|0]; r1.textContent=SYMS[Math.random()*SYMS.length|0]; r2.textContent=SYMS[Math.random()*SYMS.length|0]; },70);
    post('/api/gato/spin',{userId,nick:userId})
      .then(d=>{
        if(d.error){ clearInterval(anim); bloquear(false); msg('❌ '+d.error,'foi'); return; }
        setTimeout(()=>{
          clearInterval(anim);
          r0.textContent=d.syms[0]; r1.textContent=d.syms[1]; r2.textContent=d.syms[2];
          setCoins(d.balance);
          if(d.kind==='all'){ msg('🎉 TRIPLO '+d.e+'! +'+fmt(d.win)+' moedas!','bom'); celebrate(d.win); }
          else if(d.kind==='pair'){ msg('😺 Dupla '+d.e+'! +'+fmt(d.win)+' moedas','bom'); celebrate(d.win); }
          else msg('😿 Nada dessa vez! Tenta de novo','foi');
          bloquear(false);
          renderRecent(d.recent||[]);
        }, 420);
      }).catch(()=>{ clearInterval(anim); bloquear(false); msg('Sem internet, tenta de novo','foi'); });
  }

  function renderRecent(list){ $('recent').innerHTML=(list||[]).map(c=>{
    const v=c.win>0?'<span class="v ok">+'+c.win+'</span>':'<span class="v nao">0</span>';
    return '<div class="chip"><span class="n">'+c.nick+'</span><span class="s">'+c.syms.join('')+'</span>'+v+'</div>';
  }).join(''); }

  function renderVila(){
    if(!village) return;
    const v=village.village;
    $('wEmoji').textContent=v.worldEmoji; $('wName').textContent=v.world;
    $('vName').textContent=v.name;
    $('vPos').textContent='Vila '+v.vid+' de '+v.totalVillages;
    $('vlvl').textContent=v.level;
    const epoch=v.pp-(v.level-1)*v.ppPerLevel;
    $('vprog').style.width=(v.ppPerLevel? epoch/v.ppPerLevel*100 : 0)+'%';
    $('btnDaily').disabled=!v.daily.available;
    $('btnDaily').innerHTML = v.daily.available
      ? ('🎁 Recompensa diária +<span id="drv">'+v.daily.reward+'</span> 🪙')
      : '✅ Diária resgatada! Volte amanhã';

    const built=v.built||{};
    $('blds').innerHTML=(order||[]).map(b=>{
      const t=built[b.id]||0;
      const isNext=v.next && v.next.id===b.id;
      let dots='';
      for(let i=1;i<=5;i++) dots+='<i class="'+(i<=t?'on':'')+'"></i>';
      const cost=(isNext&&v.next)?'💰 '+fmt(v.next.custo)+' moedas · Nv '+(t+1)+'/'+v.next.tier:v.max?'🌟 Max':'💰 feito';
      return '<div class="bld '+(t>=5?'done':'')+(isNext?' next':'')+'">'+
        '<div class="e">'+b.e+'</div>'+
        '<div class="nome">'+b.nome+'</div>'+
        '<div class="tiers">'+dots+'</div>'+
        '<div class="custo">'+cost+'</div></div>';
    }).join('');

    const adv=$('advWrap');
    if(!adv){
      $('blds').insertAdjacentHTML('afterend',
        '<button id="buildBtn" class="build-btn">...</button>'+
        '<button id="advWrap" class="adv-btn">🚀 Avançar para a próxima vila</button>');
      $('buildBtn').onclick=construir; $('advWrap').onclick=avancar;
    }
    const bb=$('buildBtn');
    if(v.complete){ bb.style.display='none'; $('advWrap').style.display='block'; }
    else{
      $('advWrap').style.display='none';
      bb.style.display='block';
      if(v.next){ bb.textContent='🔨 Construir '+v.next.e+' '+v.next.nome+' · Nv '+v.next.tier+'/5 · 💰 '+fmt(v.next.custo); }
      else{ bb.style.display='none'; }
    }
  }

  function construir(){
    post('/api/gato/build',{userId}).then(d=>{
      if(d.error){ toast('❌ '+d.error); return; }
      setCoins(d.balance); village=d; toast('🏠 '+d.building.e+' '+d.building.nome+' → Nv '+d.building.tier+'!');
      renderVila();
    }).catch(()=>toast('Sem internet'));
  }

  function avancar(){
    post('/api/gato/advance',{userId}).then(d=>{
      if(d.error){ toast('❌ '+d.error); return; }
      setCoins(d.balance); village=d;
      celebrate(d.reward);
      toast('🚀 '+d.to.worldEmoji+' Nova vila: '+d.to.name+'  +'+fmt(d.reward)+' 🪙');
      renderVila();
    }).catch(()=>toast('Sem internet'));
  }

  function carregarVila(){
    fetch(API+'/api/gato/village?userId='+userId).then(r=>r.json()).then(d=>{
      if(d.error) return;
      village=d; setCoins(d.balance); renderVila();
    }).catch(()=>{});
  }

  function diaria(){
    post('/api/gato/daily',{userId}).then(d=>{
      if(d.error){ toast('❌ '+d.error); return; }
      setCoins(d.balance); toast('🎁 +'+fmt(d.reward)+' moedas resgatadas!'); celebrate(d.reward);
      carregarVila();
    }).catch(()=>toast('Sem internet'));
  }

  function status(){
    fetch(API+'/api/gato/status').then(r=>r.json()).then(d=>{
      spinCost=d.spinCost; $('custo').textContent=spinCost;
      order=d.buildings||[];
      renderRecent(d.recent||[]);
    }).catch(()=>{});
  }

  $('btnSpin').onclick=girar;
  $('btnDaily').onclick=diaria;
  $('tabSlot').onclick=()=>{ $('tabSlot').className='tab on'; $('tabVila').className='tab'; $('panelSlot').classList.remove('hidden'); $('panelVila').classList.add('hidden'); };
  $('tabVila').onclick=()=>{ $('tabVila').className='tab on'; $('tabSlot').className='tab'; $('panelVila').classList.remove('hidden'); $('panelSlot').classList.add('hidden'); carregarVila(); };

  fetch(API+'/api/balance/'+userId).then(r=>r.json()).then(d=>setCoins(d.balance)).catch(()=>{});
  status(); setInterval(status,5000);
  carregarVila();
</script>
</body>
</html>
