<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatinho · Admin</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui; background:#0b120b; color:#d9e8cf; min-height:100vh; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:26px; margin-bottom:14px; color:#ffe680; letter-spacing:1px; }
  #login { max-width:360px; margin:12vh auto; background:#14201a; border:1px solid #29402c; border-radius:18px; padding:28px; }
  #login h2 { color:#ffd968; margin-bottom:16px; font-size:20px; }
  #login input { width:100%; padding:12px; border-radius:10px; border:1px solid #33502f; background:#0d140d; color:#fff; font-size:16px; margin-bottom:12px; }
  button { cursor:pointer; border:none; border-radius:10px; padding:10px 14px; font-weight:800; font-size:14px; }
  .btn { background:linear-gradient(135deg,#ffd968,#ff8a00); color:#3a2400; }
  .btn2 { background:#263a26; color:#cfe3c7; border:1px solid #33502f; }
  .hidden { display:none; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { padding:9px 14px; border-radius:10px; border:1px solid #29402c; background:#16221a; color:#cfe3c7; font-weight:800; }
  .tab.on { background:linear-gradient(135deg,#4ade80,#16a34a); color:#06280f; border-color:#9ef7c0; }
  .card { background:#13201a; border:1px solid #23402c; border-radius:16px; padding:18px; margin-bottom:14px; }
  .card h3 { color:#ffd968; font-size:15px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; }
  .kv { background:#0d150d; border:1px solid #1f331f; border-radius:10px; padding:10px; font-size:13px; }
  .kv b { display:block; color:#9fe3a0; font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid #1f331f; }
  th { color:#86a07f; font-size:11px; text-transform:uppercase; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row input[type=number], .row input[type=text] { background:#0d140d; border:1px solid #29402c; border-radius:8px; color:#fff; padding:8px; flex:1; min-width:120px; }
  select { background:#0d140d; color:#fff; border:1px solid #29402c; border-radius:8px; padding:8px; }
  .pill { background:#0d150d; border:1px solid #1f331f; border-radius:999px; padding:6px 12px; font-size:12px; }
  .on2 { color:#4ade80; font-weight:800; } .off2 { color:#ff9d6b; font-weight:800; }
  .tt { font-family:ui-monospace,monospace; font-size:12px; color:#b9cfb0; line-height:1.5; word-break:break-word; }
  .muted { color:#7f9a77; font-size:12px; }
  .err { color:#ff9d6b; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#0b120b; border-top:1px solid #1f331f; padding:8px 16px; display:flex; gap:8px; align-items:center; font-size:12px; color:#7f9a77; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="login" class="">
  <h2>🔐 Painel do Gatinho</h2>
  <input id="pass" type="password" placeholder="Senha administrativa" autocomplete="off">
  <button class="btn" id="entrar" style="width:100%">Entrar</button>
  <div class="muted" id="loginMsg" style="margin-top:10px"></div>
</div>

<div id="painel" class="wrap hidden">
  <h1>🛠️ Gatinho · Administração</h1>
  <div class="tabs">
    <button class="tab on" data-t="geral">Visão geral</button>
    <button class="tab" data-t="config">Config</button>
    <button class="tab" data-t="eventos">Eventos</button>
    <button class="tab" data-t="jogadores">Jogadores</button>
    <button class="tab" data-t="analytics">Análise</button>
    <button class="tab" data-t="erros">Erros</button>
    <button class="tab" data-t="ads">Anúncios</button>
    <button class="tab" data-t="audit">Auditoria</button>
  </div>

  <section class="card hidden" id="sec-geral">
    <h3>Visão geral</h3>
    <div class="grid" id="geralGrid"></div>
    <div class="muted" style="margin-top:10px">Edição de saldo exige auditoria — registrada em <b>Auditoria</b>.</div>
  </section>

  <section class="card hidden" id="sec-config">
    <h3>Configuração (tempo real via servidor)</h3>
    <div id="cfgRows" class="grid"></div>
  </section>

  <section class="card hidden" id="sec-eventos">
    <h3>Eventos</h3>
    <div id="evtList"></div>
    <div class="card" style="margin-top:10px">
      <h3>Criar evento</h3>
      <div class="row"><input id="eId" type="text" placeholder="id (ex: natal)" style="flex:1"><input id="eNome" type="text" placeholder="nome"></div>
      <div class="row"><input id="eEmoji" type="text" placeholder="emoji" style="max-width:90px"><input id="eDe" type="text" placeholder="de (2026-12-20)" style="max-width:140px"><input id="eAte" type="text" placeholder="até (2027-01-05)" style="max-width:140px"><input id="eTxt" type="text" placeholder="texto"></div>
      <div class="row"><input id="eEfeito" type="text" placeholder="efeito: catMult:1.3, coinsMult:1.2, raidMult:1.5"><button class="btn" id="criarEv">Criar</button></div>
    </div>
  </section>

  <section class="card hidden" id="sec-jogadores">
    <h3>Jogadores <span class="pill" id="userCount"></span></h3>
    <div style="overflow:auto"><table><thead><tr><th>#</th><th>Id</th><th>Lv</th><th>Vila</th><th>Gatos</th><th>Saldo</th></tr></thead><tbody id="userRows"></tbody></table></div>
  </section>

  <section class="card hidden" id="sec-analytics">
    <h3>Eventos de análise</h3>
    <div class="chips" id="anaChips"></div>
    <div class="tt" id="anaTail" style="margin-top:10px"></div>
  </section>

  <section class="card hidden" id="sec-erros">
    <h3>Telemetria de erros</h3>
    <div class="tt" id="errTail"></div>
  </section>

  <section class="card hidden" id="sec-ads">
    <h3>Renda de anúncios</h3>
    <div class="grid" id="adsGrid"></div>
    <div class="tt" id="adsTail" style="margin-top:10px"></div>
  </section>

  <section class="card hidden" id="sec-audit">
    <h3>Auditoria de saldo</h3>
    <div class="row" style="margin-bottom:10px">
      <input id="bUser" type="text" placeholder="userId"><input id="bDelta" type="number" placeholder="delta (+/-)" step="1">
      <input id="bMotivo" type="text" placeholder="motivo (obrigatório)"><button class="btn" id="ajustaSaldo">Ajustar saldo</button>
      <span class="muted err" id="auditMsg"></span>
    </div>
    <div class="tt" id="auditTail"></div>
  </section>
</div>

<footer>
  <span id="footState" class="muted">—</span>
  <span style="flex:1"></span>
  <button class="btn2" id="sair">Sair</button>
</footer>

<script>
  const API = '';
  let token = null;
  const $ = id => document.getElementById(id);

  async function api(path, body, method) {
    const o = { method: method || (body ? 'POST' : 'GET'), headers: {} };
    if (body) o.headers['Content-Type'] = 'application/json';
    if (token) o.headers['x-admin'] = token;
    if (body) o.body = JSON.stringify(body);
    const r = await fetch(API + path, o);
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { sair(); throw new Error('sessão expirada'); }
    return d;
  }

  async function login() {
    const pass = $('pass').value;
    const d = await api('/api/admin/login', { pass });
    if (!d.token) { $('loginMsg').textContent = 'Senha incorreta.'; return; }
    token = d.token;
    $('login').classList.add('hidden');
    $('painel').classList.remove('hidden');
    aba('config');
    refresh();
  }

  const confLabels = {
    spinCost:'Custo do giro', betGrowth:'Cresc. aposta/vila', payoutMult:'Multiplicador de pagamento',
    dailyReward:'Recompensa diária', villageCostGrowth:'Cresc. custo/vila', adReward:'Prêmio anúncio',
    adCooldownSec:'Cooldown anúncio (s)', adDailyCap:'Teto diário anúncios', giftCost:'Custo presente',
    streakBase:'Base sequência', streakMax:'Sequência máxima', streakFinalMult:'Mult. final sequência',
    raidPrizeMult:'Mult. prêmio saque', defenseChance:'Chance defesa', enemyStealPct:'% roubo inimigo',
    ppPerLevel:'XP por nível', luckConsolation:'Consolo da sorte'
  };

  let cfg = null;
  function renderCfg() {
    if (!cfg) return;
    $('cfgRows').innerHTML = Object.keys(cfg).filter(k => confLabels[k])
      .map(k => '<div class="kv"><b>'+k+'</b>'+
        '<div class="row" style="margin:0"><input type="number" step="any" value="'+cfg[k]+'" data-k="'+k+'">'+
        '<button class="btn2" data-save="'+k+'">Salvar</button></div></div>').join('');
    [...document.querySelectorAll('[data-save]')].forEach(b => b.onclick = async () => {
      const key = b.dataset.save;
      const value = Number(document.querySelector('[data-k="'+key+'"]').value);
      const r = await api('/api/admin/config', { key, value });
      if (r.error) { alert('❌ ' + r.error); return; }
      cfg = r.config; refresh();
    });
  }

  function renderEvts(events) {
    $('evtList').innerHTML = events.map(e =>
      '<div class="row" style="justify-content:space-between;background:#0d150d;border:1px solid #1f331f;border-radius:10px;padding:10px 12px">'+
      '<span>'+e.e+' <b>'+e.nome+'</b> <span class="muted">'+e.de+' → '+e.ate+' · '+(e.txt||'')+'</span></span>'+
      '<button class="'+(e.ligado?'btn2':'btn')+'" data-tog="'+e.id+'" data-lig="'+(!e.ligado)+'">'+(e.ligado?'Desativar':'Ativar')+'</button></div>'
    ).join('');
    [...document.querySelectorAll('[data-tog]')].forEach(b => b.onclick = async () => {
      await api('/api/admin/event', { action: 'toggle', id: b.dataset.tog, ligado: b.dataset.lig === 'true' });
      refresh();
    });
  }

  async function refresh() {
    const [st, cfgd, ev, us, ana, er, ads, aud] = await Promise.all([
      api('/api/admin/analytics'), api('/api/admin/config'), api('/api/admin/events'),
      api('/api/admin/users'), api('/api/admin/analytics'), api('/api/admin/errors'),
      api('/api/admin/ads'), api('/api/admin/audit')
    ]);
    cfg = cfgd.config;
    renderCfg(); renderEvts(ev.events);
    $('geralGrid').innerHTML = [
      ['Erros registrados', er.state ? er.state.errors : 0], ['Eventos de análise', st.state ? st.state.events : 0],
      ['Auditorias', st.state ? st.state.audit : 0], ['Usuários', us.stats ? us.stats.users : 0],
      ['Sessões admin', st.state ? st.state.sessions : 0], ['Receita ads (R$)', (ads.totalRevenue||0).toFixed(2).replace('.',',')]
    ].map(([k,v]) => '<div class="kv"><b>'+k+'</b>'+v+'</div>').join('');
    $('userCount').textContent = (us.stats ? us.stats.users : 0) + ' usuários';
    $('userRows').innerHTML = (us.top||[]).map((u,i) =>
      '<tr><td>'+(i+1)+'</td><td>'+u.id+'</td><td>'+(u.level||1)+'</td><td>'+(u.vid||1)+'</td><td>'+(u.cats||0)+'</td><td>'+(u.balance||0)+'</td></tr>').join('') ||
      '<tr><td colspan="6" class="muted">Sem jogadores ainda</td></tr>';
    $('anaChips').innerHTML = Object.entries(ana.counters||{}).map(([k,v]) => '<span class="pill">'+k+' <b>'+v+'</b></span>').join('') || '<span class="muted">sem dados ainda</span>';
    $('anaTail').textContent = (ana.recent||[]).slice(0,15).map(e => new Date(e.ts).toLocaleTimeString('pt-BR')+'  '+e.kind+'  '+(e.d||'')).join('\n');
    $('errTail').textContent = (er.errors||[]).slice(0,30).map(e => new Date(e.ts).toLocaleTimeString('pt-BR')+'  '+e.kind+'  '+e.msg).join('\n') || 'Nenhum erro registrado.';
    $('adsGrid').innerHTML = Object.entries(ads.totals||{}).map(([k,v]) =>
      '<div class="kv"><b>'+k+'</b>'+(v.imps||0)+' · R$ '+(v.revenue||0).toFixed(2).replace('.',',')+'</div>').join('');
    $('adsTail').textContent = 'Hoje: R$ '+(ads.dayRevenue||0).toFixed(2).replace('.',',')+' · total R$ '+(ads.totalRevenue||0).toFixed(2).replace('.',',');
    $('auditTail').textContent = (aud.audit||[]).slice(0,20).map(a =>
      new Date(a.ts).toLocaleString('pt-BR')+'  admin:'+a.admin+'  '+a.userId+'  '+(a.delta>0?'+':'')+a.delta+'  ('+a.old+'→'+a.novo+')  '+(a.motivo||'')).join('\n') || 'Sem auditorias.';
    $('footState').textContent = 'Sessões admin: '+(st.state ? st.state.sessions : 0);
  }

  function aba(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === name));
    document.querySelectorAll('section[id^="sec-"]').forEach(s => s.classList.add('hidden'));
    const sec = $('sec-'+name); if (sec) sec.classList.remove('hidden');
    if (name === 'analytics' || name === 'erros' || name === 'ads' || name === 'audit' || name === 'jogadores') refresh();
  }

  async function sair() { try { await api('/api/admin/logout'); } catch (e) {} token = null; location.reload(); }

  $('entrar').onclick = login;
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('sair').onclick = sair;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => aba(t.dataset.t));
  $('criarEv').onclick = async () => {
    let efeito = {};
    try { const parts = $('eEfeito').value.split(','); parts.forEach(p => { const kv = p.split(':'); if (kv.length === 2) efeito[kv[0].trim()] = Number(kv[1].trim()); }); } catch (e) {}
    const r = await api('/api/admin/event', { action: 'create', event: {
      id: $('eId').value, nome: $('eNome').value, e: $('eEmoji').value, de: $('eDe').value,
      ate: $('eAte').value, txt: $('eTxt').value, efeito
    }});
    if (r.error) { alert('❌ ' + r.error); return; }
    ['eId','eNome','eEmoji','eDe','eAte','eTxt','eEfeito'].forEach(i => $(i).value = '');
    refresh();
  };
  $('ajustaSaldo').onclick = async () => {
    $('auditMsg').textContent = '';
    const r = await api('/api/admin/balance', { userId: $('bUser').value, delta: Number($('bDelta').value), motivo: $('bMotivo').value });
    if (r.error) { $('auditMsg').textContent = '❌ ' + r.error; return; }
    $('auditMsg').textContent = '✔ saldo agora: ' + r.balance + ' (auditado)';
    setTimeout(() => { $('auditMsg').textContent = ''; refresh(); }, 1200);
  };
</script>
</body>
</html>
